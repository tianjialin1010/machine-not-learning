[project]
name = "jev-decision-service"
version = "0.1.0"
description = "A JEV-style structured decision layer for conversation routing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jev = "jev_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_service"]
